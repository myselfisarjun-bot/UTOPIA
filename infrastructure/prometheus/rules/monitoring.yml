groups:
  - name: backend.rules
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"
          runbook_url: "https://docs.company.com/runbooks/high-error-rate"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      # Database connection issues
      - alert: DatabaseConnectionDown
        expr: up{job="mongodb"} == 0
        for: 2m
        labels:
          severity: critical
          team: database
        annotations:
          summary: "Database connection is down"
          description: "MongoDB has been down for more than 2 minutes"

      # Memory usage high
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) / (node_memory_MemTotal_bytes / 1024 / 1024) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 80%"

      # Disk space low
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.mountpoint }}"

      # CPU usage high
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for 10 minutes"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} service has been down for more than 1 minute"

      # Authentication failures
      - alert: HighAuthenticationFailures
        expr: rate(user_actions_total{action="login_failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failure rate is {{ $value }} per second"

  - name: mobile.rules
    rules:
      # Mobile app crash rate
      - alert: HighMobileCrashRate
        expr: rate(mobile_crashes_total[10m]) > 0.01
        for: 5m
        labels:
          severity: critical
          team: mobile
        annotations:
          summary: "High mobile app crash rate"
          description: "Mobile app crash rate is {{ $value }} per second"

      # Mobile analytics events drop
      - alert: MobileAnalyticsEventsDrop
        expr: rate(analytics_events_total{source="mobile"}[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
          team: mobile
        annotations:
          summary: "Mobile analytics events dropped"
          description: "Mobile analytics events are below normal rate"

  - name: infrastructure.rules
    rules:
      # Container restart
      - alert: ContainerRestart
        expr: increase(container_start_time_seconds[1m]) > 0
        for: 0m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} restarted"

      # Load balancer down
      - alert: LoadBalancerDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Load balancer is down"
          description: "Nginx load balancer has been down for more than 1 minute"

      # Elasticsearch cluster health
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 0m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Elasticsearch cluster is red"
          description: "Elasticsearch cluster health is red"

      # Prometheus target down
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Prometheus target is down"
          description: "Target {{ $labels.job }}:{{ $labels.instance }} is down"