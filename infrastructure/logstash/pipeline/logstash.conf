input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json
  }
  
  http {
    port => 8080
    codec => "json"
  }
}

filter {
  # Parse backend logs
  if [fields][service] == "backend" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level}: %{GREEDYDATA:message}" 
      }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    if [level] == "error" {
      mutate {
        add_tag => [ "error" ]
        add_field => { "severity" => "high" }
      }
    }
  }
  
  # Parse mobile app logs
  if [fields][service] == "mobile" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:message}"
      }
    }
    
    if [message] =~ /CRASH/ {
      mutate {
        add_tag => [ "crash" ]
        add_field => { "severity" => "critical" }
      }
    }
  }
  
  # Parse Nginx access logs
  if [fields][log_type] == "nginx_access" {
    grok {
      match => {
        "message" => "%{NGINXACCESS}"
      }
    }
    
    mutate {
      convert => { "response" => "integer" }
      convert => { "bytes" => "integer" }
      convert => { "responsetime" => "float" }
    }
  }
  
  # Add geolocation for IP addresses
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }
  
  # Extract user agent information
  if [agent] {
    useragent {
      source => "agent"
      target => "useragent"
    }
  }
  
  # Add hostname
  if [host] {
    mutate {
      add_field => { "server_name" => "%{host}" }
    }
  }
  
  # Standardize timestamp
  if [@timestamp] {
    mutate {
      add_field => { "log_timestamp" => "%{@timestamp}" }
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "host", "ecs", "agent", "input", "log" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "monitoring-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output (optional)
  stdout {
    codec => rubydebug
  }
  
  # Send errors to separate index
  if "error" in [tags] or "crash" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "monitoring-errors-%{+YYYY.MM.dd}"
    }
  }
}